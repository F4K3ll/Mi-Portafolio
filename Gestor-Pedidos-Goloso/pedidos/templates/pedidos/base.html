<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Goloso Gelato{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'pedidos/css/estilos.css' %}">
</head>
<body>

<!-- Navbar Moderna -->
<nav id="main-navbar" class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'agenda' %}">
            <i class="bi bi-ice-cream-fill me-2"></i>
            Goloso Gelato
        </a>
        <div class="d-flex align-items-center">
            {% if user.is_authenticated %}
                <span class="text-white me-3 small">
                    <i class="bi bi-person-fill me-1"></i>{{ user.username }}
                </span>
                <a href="{% url 'admin:logout' %}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<!-- Contenido principal -->
<div class="container">
    {% block content %}
    {% endblock %}
</div>

<!-- Footer -->
<footer class="text-center">
    <div class="container">
        <p class="mb-0">
            <i class="bi bi-ice-cream-fill me-2"></i>
            Goloso Gelato - Sistema de Gestión de Pedidos
        </p>
        <small class="mt-2 d-block">Desarrollado con ❤️ por Julián</small>
    </div>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Detectamos si estamos en local o en producción
    const navbar = document.getElementById('main-navbar');
    const hostname = window.location.hostname;

    if (hostname === '127.0.0.1' || hostname === 'localhost') {
        navbar.style.background = 'linear-gradient(135deg, #0056b3 0%, #003d82 100%)';
        
        // Verificamos que no exista ya para no duplicarlo
        if (!document.getElementById('dev-badge')) {
            const devTag = document.createElement('span');
            devTag.id = 'dev-badge';
            devTag.innerHTML = '<small class="ms-2 badge bg-warning text-dark"><i class="bi bi-laptop me-1"></i>MODO LOCAL</small>';
            navbar.querySelector('.container').appendChild(devTag);
        }
    }
</script>
</body>
</html>
