<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestor de Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #faf9f4;
            --color-surface: #ffffff;
            --color-text: #22211d;
            --color-text-muted: #6b6a63;
            --color-primary: #2f6b4f;
            --color-primary-dark: #1f4d38;
            --color-accent: #c13564;
            --color-border: #e4e0d6;
            --color-pendiente: #c9922a;
            --color-listo: #2f6b4f;
            --color-entregado: #9a988f;
            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'Karla', system-ui, -apple-system, sans-serif;
        }
        body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
        h1, h2, h3, .brand { font-family: var(--font-display); }
        .site-header { background: var(--color-primary); color: #fff; }
        .site-header .brand { font-size: 1.4rem; font-weight: 700; color: #fff; text-decoration: none; }
        .site-header a { color: rgba(255, 255, 255, 0.85); text-decoration: none; font-weight: 500; }
        .site-header a:hover { color: #fff; }
        .page-title { font-weight: 700; margin-bottom: 1.5rem; color: var(--color-primary-dark); }
        .btn-primary { background-color: var(--color-primary); border-color: var(--color-primary); }
        .btn-primary:hover, .btn-primary:focus { background-color: var(--color-primary-dark); border-color: var(--color-primary-dark); }
        .btn-outline-primary { color: var(--color-primary); border-color: var(--color-primary); }
        .btn-outline-primary:hover { background-color: var(--color-primary); border-color: var(--color-primary); }
        .btn-outline-success { color: var(--color-accent); border-color: var(--color-accent); }
        .btn-outline-success:hover { background-color: var(--color-accent); border-color: var(--color-accent); }
        .card-surface { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 1.5rem; }
        .form-control:focus, .form-select:focus { border-color: var(--color-primary); box-shadow: 0 0 0 0.2rem rgba(47, 107, 79, 0.15); }
        .table thead th { font-family: var(--font-body); font-weight: 700; color: var(--color-text-muted); border-bottom: 2px solid var(--color-border); font-size: 0.85rem; }
        .estado-pill { display: inline-block; padding: 0.25rem 0.65rem; border-radius: 999px; font-size: 0.8rem; font-weight: 700; color: #fff; }
        .estado-pendiente { background: var(--color-pendiente); }
        .estado-listo { background: var(--color-listo); }
        .estado-entregado { background: var(--color-entregado); }
        .alert-success { background-color: #e8f2ec; border-color: var(--color-primary); color: var(--color-primary-dark); }
        .alert-danger { background-color: #f8e6ec; border-color: var(--color-accent); color: #7a2140; }
    </style>
</head>
<body>
    <header class="site-header py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
            <a href="{% url 'agenda' %}" class="brand">🍦 Heladería</a>
            <nav class="d-flex gap-3">
                <a href="{% url 'agenda' %}">Agenda</a>
                <a href="{% url 'nuevo_pedido' %}">Nuevo pedido</a>
            </nav>
        </div>
    </header>
    <div class="container pb-5">
        {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
