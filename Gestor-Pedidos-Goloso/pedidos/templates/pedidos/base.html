<nav id="main-navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'agenda' %}">Goloso Gelato</a>
        <!-- ... resto de la nav ... -->
    </div>

<!-- ... contenido de los bloques ... -->

<script>
    // Detectamos si estamos en local o en producción
    const navbar = document.getElementById('main-navbar');
    const hostname = window.location.hostname;

    if (hostname === '127.0.0.1' || hostname === 'localhost') {
        // En LOCAL: Color azul oscuro / petróleo para diferenciar
        navbar.classList.remove('bg-dark');
        navbar.style.backgroundColor = '#0056b3'; 
        
        // Opcional: Agregar un texto que diga "MODO DESARROLLO"
        const devTag = document.createElement('span');
        devTag.innerHTML = '<small class="ms-2 badge bg-warning text-dark">MODO LOCAL</small>';
        navbar.querySelector('.container').appendChild(devTag);
    } else {
        // En PRODUCCIÓN: Color verde oscuro o mantener el negro original
        navbar.classList.remove('bg-dark');
        navbar.style.backgroundColor = '#1a5928'; // Un verde "heladería"
    }
</script>
</body>
</html>
