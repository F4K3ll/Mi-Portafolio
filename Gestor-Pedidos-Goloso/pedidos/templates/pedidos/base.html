<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Goloso Gelato{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #faf9f4;
            --color-surface: #ffffff;
            --color-text: #22211d;
            --color-text-muted: #6b6a63;
            --color-primary: #2f6b4f;
            --color-primary-dark: #1f4d38;
            --color-accent: #c13564;
            --color-border: #e4e0d6;
            --color-pendiente: #c9922a;
            --color-listo: #2f6b4f;
            --color-entregado: #9a988f;
            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'Karla', system-ui, -apple-system, sans-serif;
        }
        body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); min-height: 100vh; display: flex; flex-direction: column; }
        h1, h2, h3, .navbar-brand { font-family: var(--font-display); }

        #main-navbar { background: var(--color-primary); }
        #main-navbar .navbar-brand { color: #fff; font-weight: 700; font-size: 1.3rem; }
        #main-navbar .btn-outline-light:hover { background: rgba(255,255,255,0.15); }

        .page-title { font-weight: 700; margin-bottom: 1.5rem; color: var(--color-primary-dark); }
        .btn-primary { background-color: var(--color-primary); border-color: var(--color-primary); }
        .btn-primary:hover, .btn-primary:focus { background-color: var(--color-primary-dark); border-color: var(--color-primary-dark); }
        .btn-outline-primary { color: var(--color-primary); border-color: var(--color-primary); }
        .btn-outline-primary:hover { background-color: var(--color-primary); border-color: var(--color-primary); }
        .btn-outline-success { color: var(--color-accent); border-color: var(--color-accent); }
        .btn-outline-success:hover { background-color: var(--color-accent); border-color: var(--color-accent); }

        .card-surface { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 1.5rem; }
        .form-control:focus, .form-select:focus { border-color: var(--color-primary); box-shadow: 0 0 0 0.2rem rgba(47, 107, 79, 0.15); }
        .table thead th { font-family: var(--font-body); font-weight: 700; color: var(--color-text-muted); border-bottom: 2px solid var(--color-border); font-size: 0.85rem; }

        .estado-pill { display: inline-block; padding: 0.25rem 0.65rem; border-radius: 999px; font-size: 0.8rem; font-weight: 700; color: #fff; }
        .estado-pendiente { background: var(--color-pendiente); }
        .estado-listo { background: var(--color-listo); }
        .estado-entregado { background: var(--color-entregado); }

        .alert-success { background-color: #e8f2ec; border-color: var(--color-primary); color: var(--color-primary-dark); }
        .alert-danger { background-color: #f8e6ec; border-color: var(--color-accent); color: #7a2140; }

        .page-subtitle { color: var(--color-text-muted); margin-top: -0.75rem; margin-bottom: 1.5rem; }
        .form-page { max-width: 640px; }
        .form-card { box-shadow: 0 1px 3px rgba(34, 33, 29, 0.06), 0 10px 28px rgba(34, 33, 29, 0.06); border: none; padding: 2rem; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem 1.25rem; margin-bottom: 2rem; }
        @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
        .field label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--color-text-muted); margin-bottom: 0.45rem; }
        .field .form-control, .field .form-select { border-color: var(--color-border); border-radius: 8px; padding: 0.6rem 0.75rem; }
        .field-error { color: var(--color-accent); font-size: 0.82rem; margin-top: 0.4rem; }
        .form-actions { display: flex; justify-content: flex-end; }
        .btn-submit { padding: 0.6rem 2rem; font-weight: 700; }

        main.container { flex: 1; }
        footer { background: var(--color-surface); border-top: 1px solid var(--color-border); color: var(--color-text-muted); padding: 1.25rem 0; margin-top: 3rem; }
        #dev-badge { background: #d97706 !important; }
    </style>
</head>
<body>

<nav id="main-navbar" class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'agenda' %}">
            <i class="bi bi-ice-cream-fill me-2"></i>Goloso Gelato
        </a>
        <div class="d-flex align-items-center">
            {% if user.is_authenticated %}
                <span class="text-white me-3 small">
                    <i class="bi bi-person-fill me-1"></i>{{ user.username }}
                </span>
                <form method="post" action="{% url 'admin:logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </button>
                </form>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container">
    {% for message in messages %}
        <div class="alert alert-success">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>

<footer class="text-center">
    <div class="container">
        <p class="mb-0"><i class="bi bi-ice-cream-fill me-2"></i>Goloso Gelato - Sistema de Gestión de Pedidos</p>
        <small class="mt-2 d-block">Desarrollado con ❤️ por Julián</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const navbar = document.getElementById('main-navbar');
    const hostname = window.location.hostname;
    if (hostname === '127.0.0.1' || hostname === 'localhost') {
        navbar.style.background = '#4a4a45';
        if (!document.getElementById('dev-badge')) {
            const devTag = document.createElement('span');
            devTag.id = 'dev-badge';
            devTag.innerHTML = '<small class="ms-2 badge text-white"><i class="bi bi-laptop me-1"></i>MODO LOCAL</small>';
            navbar.querySelector('.container').appendChild(devTag);
        }
    }
</script>
</body>
</html>
